[package]
name = "klepp"
version = "0.1.0"
edition = "2021"
description = "A small, glassy clipboard manager for macOS"
license = "MIT"
repository = "https://github.com/jonasks/klepp"
publish = false

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-runtime-wry = { version = "3.0.0-alpha.1", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = [
  "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSAlert",
  "NSGlassEffectView", "NSView", "NSWindow", "NSResponder", "NSColor",
] }
core-graphics = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
