<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klepp</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: light-dark(#141414, #f4f4f4);
    --fg-dim: light-dark(rgba(0,0,0,.55), rgba(255,255,255,.6));
    --row-hover: light-dark(rgba(0,0,0,.06), rgba(255,255,255,.08));
    --row-sel: light-dark(rgba(0,0,0,.11), rgba(255,255,255,.16));
    --line: light-dark(rgba(0,0,0,.10), rgba(255,255,255,.14));
    --mark: light-dark(rgba(255,204,0,.55), rgba(255,214,10,.45));
    --danger: #ff453a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    color: var(--fg);
    font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #panel {
    height: 100%;
    display: flex; flex-direction: column;
    border-radius: 22px;
    overflow: hidden;
  }
  #top {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 8px;
  }
  #top .logo {
    font-size: 15px; font-weight: 700; letter-spacing: .3px;
    padding: 2px 8px; border-radius: 8px;
    background: var(--row-sel);
  }
  #q {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: 17px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--fg);
    -webkit-user-select: text; user-select: text;
  }
  #q::placeholder { color: var(--fg-dim); }
  #count { color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #hint { color: var(--fg-dim); font-size: 11px; white-space: nowrap; }
  kbd {
    font: inherit; padding: 0 4px; border-radius: 4px;
    background: var(--row-hover); border: 1px solid var(--line);
  }
  #body {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    border-top: 1px solid var(--line);
  }
  #list {
    list-style: none; margin: 0; padding: 8px;
    overflow-y: auto; overscroll-behavior: contain;
  }
  #list li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 10px; cursor: default;
  }
  #list li:hover { background: var(--row-hover); }
  #list li.sel { background: var(--row-sel); }
  #list .t {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
  }
  #list .t mark { background: var(--mark); color: inherit; border-radius: 3px; }
  #list .thumb {
    width: 44px; height: 28px; object-fit: cover; border-radius: 5px;
    background: var(--row-hover); box-shadow: 0 0 0 1px var(--line);
  }
  #preview img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; display: block; }
  #list .meta {
    color: var(--fg-dim); font-size: 11px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #list .x {
    visibility: hidden; border: 0; background: transparent; cursor: pointer;
    color: var(--fg-dim); font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  #list li:hover .x, #list li.sel .x { visibility: visible; }
  #list .x:hover { color: var(--danger); background: var(--row-hover); }
  #preview {
    margin: 0; padding: 12px 16px;
    white-space: pre-wrap;
    border-left: 1px solid var(--line);
    overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    -webkit-user-select: text; user-select: text;
  }
  #empty {
    grid-column: 1 / -1; display: none; place-items: center;
    color: var(--fg-dim); font-size: 14px;
  }
  #body.empty > :not(#empty) { display: none; }
  #body.empty #empty { display: grid; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="panel">
  <div id="top">
    <span class="logo">klepp</span>
    <input id="q" type="text" placeholder="Search clipboard history…" autocomplete="off" spellcheck="false">
    <span id="count"></span>
    <span id="hint"><kbd>↑↓</kbd> move · <kbd>⏎</kbd> paste · <kbd>⌘⌫</kbd> delete · <kbd>esc</kbd> close</span>
  </div>
  <div id="body">
    <ul id="list"></ul>
    <div id="preview"></div>
    <div id="empty">Nothing here yet — copy something.</div>
  </div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const preview = document.getElementById('preview');
  const count = document.getElementById('count');
  const body = document.getElementById('body');

  let clips = [];
  let sel = 0;

  async function load() {
    clips = await invoke('list', { query: q.value });
    sel = Math.min(sel, Math.max(0, clips.length - 1));
    render();
  }

  function fmtTime(iso) {
    const d = new Date(iso), now = new Date();
    const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    if (sameDay(d, now)) return hm;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (sameDay(d, y)) return 'yesterday ' + hm;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + hm;
  }

  const imageSrc = c => `klepp://localhost/image/${c.id}`;
  const imageLabel = c => `Image · ${c.width}×${c.height}`;

  function terms() {
    return q.value.split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
  }

  // Build a highlighted preview line using text nodes only (never innerHTML).
  function highlighted(text) {
    const el = document.createElement('span');
    el.className = 't';
    const line = text.replace(/\s+/g, ' ').trim().slice(0, 300);
    const ts = terms();
    if (!ts.length) { el.textContent = line; return el; }
    const re = new RegExp('(' + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
    for (const part of line.split(re)) {
      if (!part) continue;
      if (ts.includes(part.toLowerCase())) {
        const m = document.createElement('mark'); m.textContent = part; el.appendChild(m);
      } else {
        el.appendChild(document.createTextNode(part));
      }
    }
    return el;
  }

  function render() {
    list.textContent = '';
    body.classList.toggle('empty', clips.length === 0);
    count.textContent = clips.length ? clips.length : '';
    clips.forEach((c, i) => {
      const li = document.createElement('li');
      if (i === sel) li.className = 'sel';
      if (c.kind === 'image') {
        const img = document.createElement('img');
        img.className = 'thumb'; img.src = imageSrc(c); img.loading = 'lazy'; img.alt = '';
        li.appendChild(img);
      }
      li.appendChild(highlighted(c.kind === 'image' ? imageLabel(c) : c.text));
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = [fmtTime(c.ts), c.app, c.kind === 'image' ? 'png' : c.len + ' ch'].filter(Boolean).join(' · ');
      li.appendChild(meta);
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕'; x.title = 'Delete';
      x.addEventListener('click', ev => { ev.stopPropagation(); removeAt(i); });
      li.appendChild(x);
      li.addEventListener('mousedown', ev => ev.preventDefault()); // keep input focus
      li.addEventListener('click', () => { sel = i; pick(); });
      list.appendChild(li);
    });
    preview.textContent = '';
    const cur = clips[sel];
    if (cur && cur.kind === 'image') {
      const img = document.createElement('img'); img.src = imageSrc(cur); img.alt = imageLabel(cur);
      preview.appendChild(img);
    } else if (cur) {
      preview.textContent = cur.text;
    }
    const selEl = list.children[sel];
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  function move(delta) {
    if (!clips.length) return;
    sel = (sel + delta + clips.length) % clips.length;
    render();
  }

  const report = message => invoke('report', { message: String(message) }).catch(() => {});
  window.addEventListener('error', ev => report(`error: ${ev.message} @${ev.lineno}`));
  window.addEventListener('unhandledrejection', ev => report(`rejection: ${ev.reason}`));

  async function pick() {
    const c = clips[sel];
    if (!c) return report('pick: nothing selected');
    try {
      const ok = await invoke('pick', { id: c.id });
      if (!ok) report(`pick: backend refused clip ${c.id}`);
    } catch (e) {
      report(`pick failed: ${e}`);
    }
  }

  async function removeAt(i) {
    const c = clips[i];
    if (!c) return;
    await invoke('remove', { id: c.id });
    if (i < sel) sel--;
    await load();
  }

  document.addEventListener('keydown', ev => {
    const ctrl = ev.ctrlKey && !ev.metaKey;
    if (ev.key === 'ArrowDown' || (ctrl && ev.key === 'n')) { ev.preventDefault(); move(1); }
    else if (ev.key === 'ArrowUp' || (ctrl && ev.key === 'p')) { ev.preventDefault(); move(-1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); pick(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); invoke('hide'); }
    else if (ev.metaKey && (ev.key === 'Backspace' || ev.key === 'Delete')) { ev.preventDefault(); removeAt(sel); }
    else if (document.activeElement !== q && ev.key.length === 1 && !ev.metaKey && !ev.ctrlKey) { q.focus(); }
  });
  document.addEventListener('contextmenu', ev => ev.preventDefault());

  q.addEventListener('input', () => { sel = 0; load(); });
  window.addEventListener('focus', () => q.focus());

  listen('klepp://clips-changed', () => load());
  listen('klepp://autopick', () => pick());
  listen('klepp://shown', () => { q.value = ''; sel = 0; load(); q.focus(); });

  load();
  q.focus();
</script>
</body>
</html>
