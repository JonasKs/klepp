name: Release

on:
  push:
    branches:
      - main
  # Re-publish the cask for an existing release, e.g. after fixing the tap step.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to the tap (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          config-file: ".github/release-please-config.json"
          manifest-file: ".github/.release-please-manifest.json"

  # Apple Silicon Klepp.app, zipped, uploaded to the release.
  #
  # With the APPLE_* secrets present, tauri signs with the Developer ID
  # certificate (hardened runtime) and notarizes through the App Store Connect
  # API, so Gatekeeper accepts the app on any Mac. Without them the app is
  # ad-hoc signed and the cask warns about quarantine.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall tauri-cli@3.0.0-alpha.2 --locked --no-confirm --force

      - name: Decide signing mode
        id: mode
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID and notarizing."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_* secrets missing: shipping an ad-hoc signed, unnotarized app."
          fi

      - name: Write notarization API key
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build Klepp.app (arm64)
        run: cargo tauri build --ci

      - name: Ad-hoc sign (unsigned builds only)
        if: steps.mode.outputs.signed != 'true'
        run: codesign --force --deep --sign - target/release/bundle/macos/Klepp.app

      - name: Verify signature
        run: |
          APP=target/release/bundle/macos/Klepp.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            spctl --assess --type execute --verbose=2 "$APP"
          fi

      - name: Zip
        run: |
          ditto -c -k --keepParent target/release/bundle/macos/Klepp.app "Klepp-${VERSION}-aarch64.zip"
          shasum -a 256 "Klepp-${VERSION}-aarch64.zip" > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "Klepp-${VERSION}-aarch64.zip" checksums.txt --repo ${{ github.repository }}

  # Writes Casks/klepp.rb straight to the tap's main branch, over SSH with a
  # write-enabled deploy key (secret HOMEBREW_TAP_DEPLOY_KEY on this repo).
  update-homebrew:
    needs: [release-please, build]
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || inputs.tag) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern checksums.txt --repo ${{ github.repository }} --dir /tmp

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: jonasks/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update cask
        run: |
          VERSION="${TAG#v}"
          SHA=$(awk '{print $1}' /tmp/checksums.txt)
          if [ "$SIGNED" = "true" ]; then
            QUARANTINE_NOTE=""
          else
            QUARANTINE_NOTE="Klepp is ad-hoc signed, not notarized. Install with
                  brew install --cask --no-quarantine klepp
                or, if Gatekeeper already blocked it:
                  xattr -dr com.apple.quarantine /Applications/Klepp.app

                "
          fi
          mkdir -p Casks
          cat > Casks/klepp.rb << CASK
          cask "klepp" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/jonasks/klepp/releases/download/v#{version}/Klepp-#{version}-aarch64.zip"
            name "Klepp"
            desc "Small, glassy clipboard manager for macOS"
            homepage "https://github.com/jonasks/klepp"

            depends_on macos: :tahoe
            depends_on arch: :arm64

            app "Klepp.app"

            uninstall quit: "com.jonas.klepp"

            zap trash: "~/.klepp"

            caveats do
              <<~EOS
                ${QUARANTINE_NOTE}Auto-paste (⏎) needs Accessibility access for Klepp in
                System Settings → Privacy & Security → Accessibility.
              EOS
            end
          end
          CASK
          sed -i 's/^          //' Casks/klepp.rb
          cat Casks/klepp.rb

      - name: Push to tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/klepp.rb
          git commit -m "feat: update klepp to $TAG" -m "https://github.com/jonasks/klepp/releases/tag/$TAG"
          git push origin HEAD:main
